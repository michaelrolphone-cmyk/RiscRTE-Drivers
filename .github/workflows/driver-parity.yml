name: Driver parity and build

on:
  push:
    branches: [main, work/native-idf-6.1]
  pull_request:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Test source drift and immutable snapshot validation
        run: python -m unittest discover -s test/parity -v
      - name: Check released and source driver parity against read-only source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/check_parity.py --output dist/source-parity.json
      - name: Check migrated-driver documentation parity
        run: python scripts/check_driver_docs.py
      - name: Preserve source parity provenance and drift diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-parity-${{ github.sha }}
          path: dist/source-parity.json
          if-no-files-found: warn
          retention-days: 14

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: bash scripts/install_native_driver_toolchain.sh
      - run: NATIVE_DRIVER_INTEGRATION=1 python -m unittest discover -s test -p test_native_driver_toolchain.py -v
      - name: Test native PIC uint64 division helper
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=all scripts/xtensa_support/unsigned_division.c test/native_unsigned_division_test.c -o /tmp/driver-unsigned-division-test
          /tmp/driver-unsigned-division-test
      - name: Test frozen ordinary clock time32 consumer
        run: |
          cc -std=c11 -D_DEFAULT_SOURCE -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=all -I sdk/compat/elf-time32 -I sdk/driver -Dclock_gettime=risc_test_clock_gettime -Dusleep=risc_test_usleep Drivers/platform_clock_v1/driver.c test/native_time32_test.c -o /tmp/driver-time32-test
          /tmp/driver-time32-test
      - run: python -m unittest discover -s test -p test_clock_source_modes.py -v
      - run: python scripts/build_platform_clock_v1.py
      - name: Qualify current ordinary-ELF clock source separately
        run: python scripts/build_platform_clock_v1.py --current-source
      - name: Retain current clock qualification and run provenance
        uses: actions/upload-artifact@v4
        with:
          name: platform-clock-v1-current
          path: dist/platform-clock-v1-current
      - name: Test i2c-esp32s3-v2 mutex queueing, drain, claims and restart
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic -pthread \
            -I test/drivers/stub_idf_i2c -I sdk/driver \
            Drivers/i2c_esp32s3_v2/driver.c test/drivers/i2c_esp32s3_v2_test.c \
            -o /tmp/i2c-esp32s3-v2-test
          /tmp/i2c-esp32s3-v2-test
      - run: python scripts/build_gt911_touch.py
      - run: python scripts/build_gps_nmea.py
      - name: Test usb-cdc-acm descriptor and protocol provider
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I sdk/driver \
            test/drivers/usb_cdc_test.c -o /tmp/usb-cdc-test
          /tmp/usb-cdc-test
      - run: python scripts/build_usb_cdc_acm.py
      - name: Test usb-cdc-acm-v2 host capability, cleanup and stale tokens
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fPIC -fvisibility=hidden -shared \
            -I sdk/driver Drivers/usb_cdc_v2/driver.c -o /tmp/usb-cdc-acm-v2.so
          cc -std=c11 -Wall -Wextra -Werror -I sdk/driver \
            test/drivers/usb_cdc_v2_test.c -ldl -o /tmp/usb-cdc-acm-v2-test
          /tmp/usb-cdc-acm-v2-test /tmp/usb-cdc-acm-v2.so
      - run: python scripts/build_usb_cdc_acm_v2.py
      - name: Read pinned ordinary serial consumer sources (not native Runtime)
        uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/T5S3-Reader
          ref: 9c8783d6f20659a514bfaeb3847a77c7213dc4f6
          path: .source/cdc-reader
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /lib/NativeApps/include/RiscRteLocationRecords.h
            /lib/NativeApps/include/T5AppApi.h
            /lib/NativeApps/include/T5PackageResourceApi.h
            /lib/NativeApps/include/T5SerialPortApi.h
            /lib/NativeApps/include/T5StreamApi.h
            /lib/hal/RuntimeFaultRetention.h
            /lib/hal/StorageGeneration.h
            /sdk/driver/RiscPackageResourcesV1.h
            /src/native/NativeSerialPortBridge.cpp
            /src/native/NativeSerialPortBridge.h
            /src/native/NativeSerialPortBridge_implementation.inc
            /src/native/NativeStreamBridge.cpp
            /src/native/NativeStreamBridge.h
            /src/native/NativeStreamBridge.p1.inc
            /src/native/NativeStreamBridge.p2.inc
            /src/native/NativeStreamBridge.p3.inc
            /src/native/NativeStreamBridge.p4.inc
            /src/network/HttpDownloader.h
            /src/runtime/capabilities/CapabilityAccess.h
            /src/runtime/capabilities/DeviceRegistry.h
            /src/runtime/capabilities/GnssStreamAuthority.h
            /src/runtime/capabilities/ProviderDevicePublisher.h
            /src/runtime/capabilities/SerialProviderDevices.h
            /src/runtime/capabilities/SerialProviderRegistry.h
            /src/runtime/drivers/InstalledProviderGraph.h
            /src/runtime/drivers/InstalledSerialInventory.h
            /src/runtime/drivers/InstalledSerialSession.h
            /src/runtime/drivers/ProviderGraphV2.cpp
            /src/runtime/drivers/ProviderGraphV2.h
            /src/runtime/drivers/ProviderModuleV2.cpp
            /src/runtime/drivers/ProviderModuleV2.h
            /src/runtime/drivers/ProviderOwnedSpecV2.h
            /src/runtime/packages/PackageCdcLineage.h
            /src/runtime/packages/PackageIdentity.h
            /src/runtime/packages/PackageJsonGuard.h
            /src/runtime/packages/PackageOrdinaryManifest.h
            /src/runtime/packages/PackageOrdinaryStage.h
            /src/runtime/packages/PackageOrdinaryTransaction.h
            /src/runtime/packages/PackagePreflight.h
            /src/runtime/packages/PackageResourcePath.h
            /src/runtime/packages/PackageUseGate.h
            /src/runtime/resources/ExecutionContext.h
            /src/runtime/streams/CooperativeGnssProducer.h
            /src/runtime/streams/GnssRecordAdapter.h
            /src/runtime/streams/LiveGnssSession.h
            /src/runtime/streams/LocationLeaseBinding.h
            /src/runtime/streams/LocationPositionSubscriptions.h
            /src/runtime/streams/RecordQueue.h
            /src/runtime/streams/StreamRuntime.cpp
            /src/runtime/streams/StreamRuntime.h
            /test/drivers/installed_serial_inventory_test.cpp
            /test/drivers/mock_usb_witness_controller_elf.c
            /test/drivers/stubs/esp_dlfcn.h
            /test/drivers/usb_witness_provider_graph_test.cpp
            /test/drivers/witness_controller_fixture.h
            /test/streams/stubs/Arduino.h
            /test/streams/stubs/HalStorage.h
            /test/streams/stubs/freertos/FreeRTOS.h
            /test/streams/stubs/freertos/semphr.h
            /test/streams/stubs/freertos/task.h
      - name: Qualify distinct ordinary CDC through actual installed streams and checked host
        run: |
          mkdir -p dist/usb-cdc-acm-ordinary-candidate
          python test/run_cdc_ordinary.py --reader-root .source/cdc-reader --mode normal --receipt dist/usb-cdc-acm-ordinary-candidate/consumer-normal.json
          python test/run_cdc_ordinary.py --reader-root .source/cdc-reader --mode sanitized --receipt dist/usb-cdc-acm-ordinary-candidate/consumer-sanitized.json
      - name: Build separate ordinary CDC candidate with current provenance
        run: python scripts/build_usb_cdc_stream.py
      - name: Retain ordinary CDC candidate and exact consumer evidence
        uses: actions/upload-artifact@v4
        with:
          name: usb-cdc-acm-ordinary-candidate
          path: dist/usb-cdc-acm-ordinary-candidate
      - name: Test preserved historical usb-ch34x-v2 matching, serial control and lifecycle
        run: |
          git show 6b2dc3c8e1f685d6fdaba58d04a763378f524b1b:driver.c > /tmp/historical-usb-ch34x-v2.c
          cc -std=c11 -Wall -Wextra -Werror -fPIC -fvisibility=hidden -shared \
            -I sdk/driver /tmp/historical-usb-ch34x-v2.c -o /tmp/usb-ch34x-v2.so
          cc -std=c11 -Wall -Wextra -Werror -I sdk/driver \
            test/drivers/usb_ch34x_v2_test.c -ldl -o /tmp/usb-ch34x-v2-test
          /tmp/usb-ch34x-v2-test /tmp/usb-ch34x-v2.so
      - run: python scripts/build_usb_ch34x_v2.py
      - name: Test current CH34x source, retained host and shared pump
        run: |
          python -m unittest discover -s test -p test_ch34x_source_modes.py -v
          bash test/run_ch34x_migration.sh normal
          bash test/run_ch34x_migration.sh sanitized
      - run: python scripts/build_usb_ch34x_v2.py --current-source
      - uses: actions/upload-artifact@v4
        with:
          name: usb-ch34x-v2-current
          path: dist/usb-ch34x-v2-current
      - name: Test preserved historical CP210x class
        run: |
          git show 876bba87ab601fafbcd873ae3fd0e14f96151d3b:driver.c > /tmp/historical-cp210x.c
          cc -std=c11 -Wall -Wextra -Werror -fPIC -fvisibility=hidden -shared \
            -I sdk/driver /tmp/historical-cp210x.c -o /tmp/usb-cp210x-v2.so
          cc -std=c11 -Wall -Wextra -Werror -I sdk/driver \
            test/drivers/usb_cp210x_v2_test.c -ldl -o /tmp/usb-cp210x-v2-test
          /tmp/usb-cp210x-v2-test /tmp/usb-cp210x-v2.so
      - run: python scripts/build_usb_cp210x_v2.py
      - name: Test current CP210x with retained host and checked-release negative
        run: |
          python -m unittest discover -s test -p test_cp210x_source_modes.py -v
          bash test/run_cp210x_migration.sh normal
          bash test/run_cp210x_migration.sh sanitized
      - run: python scripts/build_usb_cp210x_v2.py --current-source
      - uses: actions/upload-artifact@v4
        with:
          name: usb-cp210x-v2-current
          path: dist/usb-cp210x-v2-current
      - name: Test usb-ftdi IDs, divisors, status stripping and quiescence
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fPIC -fvisibility=hidden -shared \
            -I sdk/driver Drivers/usb_ftdi/driver.c -o /tmp/usb-ftdi.so
          cc -std=c11 -Wall -Wextra -Werror -I sdk/driver \
            test/drivers/usb_ftdi_test.c -ldl -o /tmp/usb-ftdi-test
          /tmp/usb-ftdi-test /tmp/usb-ftdi.so
      - run: python scripts/build_usb_ftdi.py
      - name: Test usb-hid generic class composition and lifecycle
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fPIC -fvisibility=hidden -shared \
            -I sdk/driver Drivers/usb_hid/driver.c -o /tmp/usb-hid.so
          cc -std=c11 -Wall -Wextra -Werror -fPIC -fvisibility=hidden -shared \
            -I sdk/driver Drivers/usb_hid_keyboard/driver.c -o /tmp/usb-hid-keyboard.so
          cc -std=c11 -Wall -Wextra -Werror -fPIC -fvisibility=hidden -shared \
            -I sdk/driver Drivers/usb_hid_gamepad/driver.c -o /tmp/usb-hid-gamepad.so
          cc -std=c11 -Wall -Wextra -Werror -I sdk/driver \
            test/drivers/usb_hid_test.c -ldl -o /tmp/usb-hid-test
          /tmp/usb-hid-test /tmp/usb-hid.so /tmp/usb-hid-keyboard.so /tmp/usb-hid-gamepad.so
      - run: python scripts/build_usb_hid.py
      - name: Test usb-host-v2 discovery, generation, transfer gates and quiescence
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fPIC -fvisibility=hidden -shared \
            -I sdk/driver Drivers/usb_host_v2/driver.c -o /tmp/usb-host-v2.so
          cc -std=c11 -Wall -Wextra -Werror -I sdk/driver \
            test/drivers/usb_host_v2_test.c -ldl -o /tmp/usb-host-v2-test
          /tmp/usb-host-v2-test /tmp/usb-host-v2.so
      - name: Build the preserved checked host and isolated native CDC candidates
        run: |
          python scripts/build_usb_host_checked_cleanup.py
          python scripts/build_usb_host_native_stream.py
          python scripts/build_usb_cdc_native.py
      - name: Test usb-mass-storage BOT, FAT16 browse/write/delete and hotplug
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fPIC -fvisibility=hidden -shared \
            -I sdk/driver Drivers/usb_mass_storage/driver.c -o /tmp/usb-mass-storage.so
          cc -std=c11 -Wall -Wextra -Werror -I sdk/driver \
            test/drivers/usb_mass_storage_test.c -ldl -o /tmp/usb-mass-storage-test
          /tmp/usb-mass-storage-test /tmp/usb-mass-storage.so
      - run: python scripts/build_usb_mass_storage_legacy_prefix.py
      - name: Test usb-hid-gamepad descriptor parsing, state and lifecycle
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I sdk/driver \
            test/drivers/usb_hid_gamepad_test.c -o /tmp/usb-hid-gamepad-test
          /tmp/usb-hid-gamepad-test
      - run: python scripts/build_usb_hid_gamepad.py
      - name: Test usb-hid-keyboard reports, subscriptions and quiescence
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I sdk/driver \
            test/drivers/usb_hid_keyboard_test.c -o /tmp/usb-hid-keyboard-test
          /tmp/usb-hid-keyboard-test
      - run: python scripts/build_usb_hid_keyboard.py
      - name: Test usb-hid-text-input translation and lifecycle
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I sdk/driver \
            test/drivers/usb_hid_text_input_test.c -o /tmp/usb-hid-text-input-test
          /tmp/usb-hid-text-input-test
      - run: python scripts/build_usb_hid_text_input.py
      - name: Test usb-ui-navigation mapping, focus and cleanup
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I sdk/driver \
            test/drivers/usb_ui_navigation_test.c -o /tmp/usb-ui-navigation-test
          /tmp/usb-ui-navigation-test
      - run: python scripts/build_usb_ui_navigation.py
      - name: Test usb-stlink V2/V2.1/V3 discovery, SWD, SWIM and quiescence
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fPIC -fvisibility=hidden -shared \
            -I sdk/driver Drivers/usb_stlink/driver.c -o /tmp/usb-stlink.so
          cc -std=c11 -Wall -Wextra -Werror -I sdk/driver \
            test/drivers/usb_stlink_test.c -ldl -o /tmp/usb-stlink-test
          /tmp/usb-stlink-test /tmp/usb-stlink.so
      - run: python scripts/build_usb_stlink.py
      - name: Test BQ current source, preserved VBUS prefixes, charger and shutdown custody
        run: |
          python test/test_bq_source_inputs.py
          python test/test_bq_source_modes.py
          python test/run_bq_migration.py
          python test/run_bq_migration.py --sanitize
      - run: python scripts/build_board_power_t5s3_v2.py
      - name: Build current BQ separately and compile target prefix assertions
        run: |
          python scripts/build_board_power_t5s3_v2.py --current-source
          CC="$(PYTHONPATH=scripts python -c 'from native_driver_toolchain import compiler; print(compiler())')"
          python test/run_bq_migration.py --target-cc "$CC"
      - uses: actions/upload-artifact@v4
        with:
          name: board-power-t5s3-v2-current-source
          path: dist/board-power-t5s3-v2-current
      - name: Test checked MSP consumer composition and legacy ABI
        run: |
          bash test/run_usb_msp_checked_consumer_test.sh
          python test/usb_msp_checked_mutation_test.py
      - run: python scripts/build_usb_msp_checked_consumer.py
      - name: Test display-epd-video surface, frame and teardown contract
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I sdk/driver \
            Drivers/display_epd_video/driver.c test/drivers/display_epd_video_test.c \
            -o /tmp/display-epd-video-test
          /tmp/display-epd-video-test
      - name: Build display-epd-video with native GCC15
        run: python scripts/build_display_epd_video.py
      - name: Test usb-xinput-gamepad discovery, state, retry, hotplug and shutdown
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I sdk/driver \
            test/drivers/usb_xinput_gamepad_test.c -o /tmp/usb-xinput-gamepad-test
          /tmp/usb-xinput-gamepad-test
      - run: python scripts/build_usb_xinput_gamepad.py
      - name: Test program-msp target gating, FRAM RMW, verify and cleanup
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fPIC -fvisibility=hidden -shared -I sdk/driver Drivers/program_msp/driver.c -o /tmp/program-msp.so
          cc -std=c11 -Wall -Wextra -Werror -I sdk/driver test/drivers/program_msp_test.c -ldl -o /tmp/program-msp-test
          /tmp/program-msp-test /tmp/program-msp.so
      - run: python scripts/build_program_msp_checked_consumer.py
      - run: python scripts/build_t5s3_usb_power_profile.py
      - uses: actions/upload-artifact@v4
        with:
          name: platform-clock-v1
          path: dist/platform-clock-v1
      - uses: actions/upload-artifact@v4
        with:
          name: gt911-touch
          path: dist/gt911-touch
      - uses: actions/upload-artifact@v4
        with:
          name: gps-nmea
          path: dist/gps-nmea
      - uses: actions/upload-artifact@v4
        with:
          name: usb-cdc-acm
          path: dist/usb-cdc-acm
      - uses: actions/upload-artifact@v4
        with:
          name: usb-cdc-acm-v2
          path: dist/usb-cdc-acm-v2
      - uses: actions/upload-artifact@v4
        with:
          name: usb-ch34x-v2
          path: dist/usb-ch34x-v2
      - uses: actions/upload-artifact@v4
        with:
          name: usb-cp210x-v2
          path: dist/usb-cp210x-v2
      - uses: actions/upload-artifact@v4
        with:
          name: usb-ftdi
          path: dist/usb-ftdi
      - uses: actions/upload-artifact@v4
        with:
          name: usb-hid
          path: dist/usb-hid
      - uses: actions/upload-artifact@v4
        with:
          name: usb-host-checked-cleanup
          path: dist/usb-host-v2-checked-cleanup
      - uses: actions/upload-artifact@v4
        with:
          name: usb-native-stream-host-and-cdc
          path: |
            dist/usb-host-v2-native-stream/
            dist/usb-cdc-acm-native-stream/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: usb-mass-storage-legacy-prefix
          path: dist/usb-mass-storage-legacy-prefix
      - uses: actions/upload-artifact@v4
        with:
          name: usb-hid-gamepad
          path: dist/usb-hid-gamepad
      - uses: actions/upload-artifact@v4
        with:
          name: usb-hid-keyboard
          path: dist/usb-hid-keyboard
      - uses: actions/upload-artifact@v4
        with:
          name: usb-hid-text-input
          path: dist/usb-hid-text-input
      - uses: actions/upload-artifact@v4
        with:
          name: usb-ui-navigation
          path: dist/usb-ui-navigation
      - uses: actions/upload-artifact@v4
        with:
          name: usb-stlink
          path: dist/usb-stlink
      - uses: actions/upload-artifact@v4
        with:
