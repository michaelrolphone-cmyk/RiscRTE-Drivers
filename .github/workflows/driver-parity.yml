name: Driver parity and build

on:
  push:
    branches: [main, work/native-idf-6.1]
  pull_request:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Test source drift and immutable snapshot validation
        run: python -m unittest discover -s test/parity -v
      - name: Check released and source driver parity against read-only source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/check_parity.py --output dist/source-parity.json
      - name: Check migrated-driver documentation parity
        run: python scripts/check_driver_docs.py
      - name: Preserve source parity provenance and drift diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-parity-${{ github.sha }}
          path: dist/source-parity.json
          if-no-files-found: warn
          retention-days: 14

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: bash scripts/install_native_driver_toolchain.sh
      - run: NATIVE_DRIVER_INTEGRATION=1 python -m unittest discover -s test -p test_native_driver_toolchain.py -v
      - name: Test native PIC uint64 division helper
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=all scripts/xtensa_support/unsigned_division.c test/native_unsigned_division_test.c -o /tmp/driver-unsigned-division-test
          /tmp/driver-unsigned-division-test
      - name: Test frozen ordinary clock time32 consumer
        run: |
          cc -std=c11 -D_DEFAULT_SOURCE -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=all -I sdk/compat/elf-time32 -I sdk/driver -Dclock_gettime=risc_test_clock_gettime -Dusleep=risc_test_usleep Drivers/platform_clock_v1/driver.c test/native_time32_test.c -o /tmp/driver-time32-test
          /tmp/driver-time32-test
      - run: python scripts/build_platform_clock_v1.py
      - name: Test i2c-esp32s3-v2 mutex queueing, drain, claims and restart
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic -pthread \
            -I test/drivers/stub_idf_i2c -I sdk/driver \
            Drivers/i2c_esp32s3_v2/driver.c test/drivers/i2c_esp32s3_v2_test.c \
            -o /tmp/i2c-esp32s3-v2-test
          /tmp/i2c-esp32s3-v2-test
      - run: python scripts/build_gt911_touch.py
      - run: python scripts/build_gps_nmea.py
      - name: Test usb-cdc-acm descriptor and protocol provider
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I sdk/driver \
            test/drivers/usb_cdc_test.c -o /tmp/usb-cdc-test
          /tmp/usb-cdc-test
      - run: python scripts/build_usb_cdc_acm.py
      - name: Test usb-cdc-acm-v2 host capability, cleanup and stale tokens
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fPIC -fvisibility=hidden -shared \
            -I sdk/driver Drivers/usb_cdc_v2/driver.c -o /tmp/usb-cdc-acm-v2.so
          cc -std=c11 -Wall -Wextra -Werror -I sdk/driver \
            test/drivers/usb_cdc_v2_test.c -ldl -o /tmp/usb-cdc-acm-v2-test
          /tmp/usb-cdc-acm-v2-test /tmp/usb-cdc-acm-v2.so
      - run: python scripts/build_usb_cdc_acm_v2.py
      - name: Test usb-ch34x-v2 matching, serial control and lifecycle
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fPIC -fvisibility=hidden -shared \
            -I sdk/driver Drivers/usb_ch34x_v2/driver.c -o /tmp/usb-ch34x-v2.so
          cc -std=c11 -Wall -Wextra -Werror -I sdk/driver \
            test/drivers/usb_ch34x_v2_test.c -ldl -o /tmp/usb-ch34x-v2-test
          /tmp/usb-ch34x-v2-test /tmp/usb-ch34x-v2.so
      - run: python scripts/build_usb_ch34x_v2.py
      - name: Test usb-cp210x-v2 vendor control, bulk, stale tokens and quiescence
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fPIC -fvisibility=hidden -shared \
            -I sdk/driver Drivers/usb_cp210x_v2/driver.c -o /tmp/usb-cp210x-v2.so
          cc -std=c11 -Wall -Wextra -Werror -I sdk/driver \
            test/drivers/usb_cp210x_v2_test.c -ldl -o /tmp/usb-cp210x-v2-test
          /tmp/usb-cp210x-v2-test /tmp/usb-cp210x-v2.so
      - run: python scripts/build_usb_cp210x_v2.py
      - name: Test usb-ftdi IDs, divisors, status stripping and quiescence
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fPIC -fvisibility=hidden -shared \
            -I sdk/driver Drivers/usb_ftdi/driver.c -o /tmp/usb-ftdi.so
          cc -std=c11 -Wall -Wextra -Werror -I sdk/driver \
            test/drivers/usb_ftdi_test.c -ldl -o /tmp/usb-ftdi-test
          /tmp/usb-ftdi-test /tmp/usb-ftdi.so
      - run: python scripts/build_usb_ftdi.py
      - name: Test usb-hid generic class composition and lifecycle
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fPIC -fvisibility=hidden -shared \
            -I sdk/driver Drivers/usb_hid/driver.c -o /tmp/usb-hid.so
          cc -std=c11 -Wall -Wextra -Werror -fPIC -fvisibility=hidden -shared \
            -I sdk/driver Drivers/usb_hid_keyboard/driver.c -o /tmp/usb-hid-keyboard.so
          cc -std=c11 -Wall -Wextra -Werror -fPIC -fvisibility=hidden -shared \
            -I sdk/driver Drivers/usb_hid_gamepad/driver.c -o /tmp/usb-hid-gamepad.so
          cc -std=c11 -Wall -Wextra -Werror -I sdk/driver \
            test/drivers/usb_hid_test.c -ldl -o /tmp/usb-hid-test
          /tmp/usb-hid-test /tmp/usb-hid.so /tmp/usb-hid-keyboard.so /tmp/usb-hid-gamepad.so
      - run: python scripts/build_usb_hid.py
      - name: Test usb-host-v2 discovery, generation, transfer gates and quiescence
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fPIC -fvisibility=hidden -shared \
            -I sdk/driver Drivers/usb_host_v2/driver.c -o /tmp/usb-host-v2.so
          cc -std=c11 -Wall -Wextra -Werror -I sdk/driver \
            test/drivers/usb_host_v2_test.c -ldl -o /tmp/usb-host-v2-test
          /tmp/usb-host-v2-test /tmp/usb-host-v2.so
      - run: python scripts/build_usb_host_v2.py
      - name: Test usb-mass-storage BOT, FAT16 browse/write/delete and hotplug
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fPIC -fvisibility=hidden -shared \
            -I sdk/driver Drivers/usb_mass_storage/driver.c -o /tmp/usb-mass-storage.so
          cc -std=c11 -Wall -Wextra -Werror -I sdk/driver \
            test/drivers/usb_mass_storage_test.c -ldl -o /tmp/usb-mass-storage-test
          /tmp/usb-mass-storage-test /tmp/usb-mass-storage.so
      - run: python scripts/build_usb_mass_storage.py
      - name: Test usb-hid-gamepad descriptor parsing, state and lifecycle
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I sdk/driver \
            test/drivers/usb_hid_gamepad_test.c -o /tmp/usb-hid-gamepad-test
          /tmp/usb-hid-gamepad-test
      - run: python scripts/build_usb_hid_gamepad.py
      - name: Test usb-hid-keyboard reports, subscriptions and quiescence
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I sdk/driver \
            test/drivers/usb_hid_keyboard_test.c -o /tmp/usb-hid-keyboard-test
          /tmp/usb-hid-keyboard-test
      - run: python scripts/build_usb_hid_keyboard.py
      - name: Test usb-hid-text-input translation and lifecycle
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I sdk/driver \
            test/drivers/usb_hid_text_input_test.c -o /tmp/usb-hid-text-input-test
          /tmp/usb-hid-text-input-test
      - run: python scripts/build_usb_hid_text_input.py
      - name: Test usb-ui-navigation mapping, focus and cleanup
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I sdk/driver \
            test/drivers/usb_ui_navigation_test.c -o /tmp/usb-ui-navigation-test
          /tmp/usb-ui-navigation-test
      - run: python scripts/build_usb_ui_navigation.py
      - name: Test usb-stlink V2/V2.1/V3 discovery, SWD, SWIM and quiescence
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fPIC -fvisibility=hidden -shared \
            -I sdk/driver Drivers/usb_stlink/driver.c -o /tmp/usb-stlink.so
          cc -std=c11 -Wall -Wextra -Werror -I sdk/driver \
            test/drivers/usb_stlink_test.c -ldl -o /tmp/usb-stlink-test
          /tmp/usb-stlink-test /tmp/usb-stlink.so
      - run: python scripts/build_usb_stlink.py
      - name: Test board-power-t5s3-v2 BQ25896 profile, VBUS and rollback lifecycle
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I sdk/driver \
            -Dt5_driver_get=t5_profile_get \
            -c Drivers/t5s3_usb_power_profile/driver.c -o /tmp/t5s3-usb-power-profile.o
          cc -std=c11 -Wall -Wextra -Werror -I sdk/driver \
            -c Drivers/bq25896/driver.c -o /tmp/board-power-t5s3-v2.o
          cc -std=c11 -Wall -Wextra -Werror -I sdk/driver \
            test/drivers/board_power_t5s3_v2_test.c \
            /tmp/board-power-t5s3-v2.o /tmp/t5s3-usb-power-profile.o \
            -o /tmp/board-power-t5s3-v2-test
          /tmp/board-power-t5s3-v2-test
      - run: python scripts/build_board_power_t5s3_v2.py
      - name: Test usb-msp MSP-FET/eZ-FET discovery, HAL framing and lifecycle
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fPIC -fvisibility=hidden -shared \
            -I sdk/driver Drivers/usb_msp/driver.c -o /tmp/usb-msp.so
          cc -std=c11 -Wall -Wextra -Werror -I sdk/driver \
            test/drivers/usb_msp_test.c -ldl -o /tmp/usb-msp-test
          /tmp/usb-msp-test /tmp/usb-msp.so
      - run: python scripts/build_usb_msp.py
      - name: Test display-epd-video surface, frame and teardown contract
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I sdk/driver \
            Drivers/display_epd_video/driver.c test/drivers/display_epd_video_test.c \
            -o /tmp/display-epd-video-test
          /tmp/display-epd-video-test
      - name: Build display-epd-video with native GCC15
        run: python scripts/build_display_epd_video.py
      - name: Test usb-xinput-gamepad discovery, state, retry, hotplug and shutdown
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I sdk/driver \
            test/drivers/usb_xinput_gamepad_test.c -o /tmp/usb-xinput-gamepad-test
          /tmp/usb-xinput-gamepad-test
      - run: python scripts/build_usb_xinput_gamepad.py
      - name: Test program-msp target gating, FRAM RMW, verify and cleanup
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fPIC -fvisibility=hidden -shared -I sdk/driver Drivers/program_msp/driver.c -o /tmp/program-msp.so
          cc -std=c11 -Wall -Wextra -Werror -I sdk/driver test/drivers/program_msp_test.c -ldl -o /tmp/program-msp-test
          /tmp/program-msp-test /tmp/program-msp.so
      - run: python scripts/build_program_msp.py
      - run: python scripts/build_t5s3_usb_power_profile.py
      - uses: actions/upload-artifact@v4
        with:
          name: platform-clock-v1
          path: dist/platform-clock-v1
      - uses: actions/upload-artifact@v4
        with:
          name: gt911-touch
          path: dist/gt911-touch
      - uses: actions/upload-artifact@v4
        with:
          name: gps-nmea
          path: dist/gps-nmea
      - uses: actions/upload-artifact@v4
        with:
          name: usb-cdc-acm
          path: dist/usb-cdc-acm
      - uses: actions/upload-artifact@v4
        with:
          name: usb-cdc-acm-v2
          path: dist/usb-cdc-acm-v2
      - uses: actions/upload-artifact@v4
        with:
          name: usb-ch34x-v2
          path: dist/usb-ch34x-v2
      - uses: actions/upload-artifact@v4
        with:
          name: usb-cp210x-v2
          path: dist/usb-cp210x-v2
      - uses: actions/upload-artifact@v4
        with:
          name: usb-ftdi
          path: dist/usb-ftdi
      - uses: actions/upload-artifact@v4
        with:
          name: usb-hid
          path: dist/usb-hid
      - uses: actions/upload-artifact@v4
        with:
          name: usb-host-v2
          path: dist/usb-host-v2
      - uses: actions/upload-artifact@v4
        with:
          name: usb-mass-storage
          path: dist/usb-mass-storage
      - uses: actions/upload-artifact@v4
        with:
          name: usb-hid-gamepad
          path: dist/usb-hid-gamepad
      - uses: actions/upload-artifact@v4
        with:
          name: usb-hid-keyboard
          path: dist/usb-hid-keyboard
      - uses: actions/upload-artifact@v4
        with:
          name: usb-hid-text-input
          path: dist/usb-hid-text-input
      - uses: actions/upload-artifact@v4
        with:
          name: usb-ui-navigation
          path: dist/usb-ui-navigation
      - uses: actions/upload-artifact@v4
        with:
          name: usb-stlink
          path: dist/usb-stlink
      - uses: actions/upload-artifact@v4
        with:
          name: board-power-t5s3-v2
          path: dist/board-power-t5s3-v2
      - uses: actions/upload-artifact@v4
        with:
          name: usb-msp
          path: dist/usb-msp
      - uses: actions/upload-artifact@v4
        with:
          name: usb-xinput-gamepad
          path: dist/usb-xinput-gamepad
      - uses: actions/upload-artifact@v4
        with:
          name: program-msp
          path: dist/program-msp
      - uses: actions/upload-artifact@v4
        with:
          name: t5s3-usb-power-profile
          path: dist/t5s3-usb-power-profile
      - uses: actions/upload-artifact@v4
        with:
          name: display-epd-video
          path: dist/display-epd-video

  historical-release-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install platformio==6.1.19
      - name: Install the exact historical S3 compiler only
        run: pio pkg install --global --tool 'espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5'
      - name: Require historical GCC8 generic release bytes
        run: |
          export NATIVE_DRIVER_CC="$HOME/.platformio/packages/toolchain-xtensa-esp32s3/bin/xtensa-esp32s3-elf-gcc"
          for driver in board_power_t5s3_v2 t5s3_usb_power_profile usb_mass_storage usb_msp usb_hid_gamepad usb_ui_navigation program_msp display_epd_video; do
            python "scripts/build_${driver}.py" --require-byte-parity
          done
      - run: python scripts/build_i2c_esp32s3_v2.py --require-byte-parity
      - name: Check out the verified historical USB controller producer
        uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Drivers
          ref: 179979b94cc5a1d4787c0ad99515c5c07edd92d8
          path: .source/legacy-controller
          persist-credentials: false
          sparse-checkout: |
            Drivers/usb_controller_esp32s3
            scripts
      - name: Verify immutable controller sources and wrong-source rejection
        env:
          HISTORICAL_CONTROLLER_SOURCE: .source/legacy-controller
        run: python -m unittest discover -s test/parity -p test_usb_controller_release_parity.py -v
      - name: Require historical USB controller release bytes
        working-directory: .source/legacy-controller
        run: python scripts/build_usb_controller_release_parity.py --require-byte-parity
      - name: Audit the historical USB controller loader map
        working-directory: .source/legacy-controller
        run: python scripts/verify_usb_controller_loader_map.py dist/usb-controller-esp32s3/driver.elf
      - name: Collect historical controller proof without changing producer inputs
        run: |
          test ! -e dist/usb-controller-esp32s3
          cp -a .source/legacy-controller/dist/usb-controller-esp32s3 dist/usb-controller-esp32s3
      - uses: actions/upload-artifact@v4
        with:
          name: historical-release-parity
          path: |
            dist/board-power-t5s3-v2/
            dist/t5s3-usb-power-profile/
            dist/usb-mass-storage/
            dist/usb-msp/
            dist/usb-hid-gamepad/
            dist/usb-ui-navigation/
            dist/program-msp/
            dist/display-epd-video/
            dist/i2c-esp32s3-v2/
            dist/usb-controller-esp32s3/
