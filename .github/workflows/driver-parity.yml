          path: dist/usb-msp-checked-consumer
      - uses: actions/upload-artifact@v4
        with:
          name: usb-xinput-gamepad
          path: dist/usb-xinput-gamepad
      - uses: actions/upload-artifact@v4
        with:
          name: program-msp-checked-consumer
          path: dist/program-msp-checked-consumer
      - uses: actions/upload-artifact@v4
        with:
          name: t5s3-usb-power-profile
          path: dist/t5s3-usb-power-profile
      - uses: actions/upload-artifact@v4
        with:
          name: display-epd-video
          path: dist/display-epd-video

  msp-candidate-qualification:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitize: [0, 1]
    env:
      SANITIZE: ${{ matrix.sanitize }}
      DRIVER_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check out actual pinned Runtime parser inputs
        uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: 6a3b3d46f5b2857eacc6e9863799dec1f466b036
          path: .source/runtime
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install PyYAML==6.0.3
      - name: Record exact head and reject changed accepted-byte inventories
        run: |
          set -euo pipefail
          mkdir -p qualification
          test "$(git rev-parse HEAD)" = "$DRIVER_SOURCE"
          printf '%s\n' "$DRIVER_SOURCE" > qualification/HEAD.txt
          git diff --exit-code a7ae39994603c4545a3c014f09051ecfc12084d2 -- dist release
          python scripts/verify_manifest_preservation.py --baseline a7ae39994603c4545a3c014f09051ecfc12084d2
          # The next test requires exact baseline inventory plus one pinned CST9217 original entry.
          python test/test_msp_checked_candidate_routes.py 2>&1 | tee qualification/candidate-routes.log
      - name: Preserve original host HID and historical MSP fixtures
        run: |
          set -euo pipefail
          mode=plain
          if [[ "$SANITIZE" == 1 ]]; then mode=sanitized; fi
          bash test/run_usb_hid_host_qualification.sh "$mode" "$RUNNER_TEMP/usb-hid-original" 2>&1 | tee qualification/original-hid.log
          bash test/run_usb_msp_detach_contract_test.sh 2>&1 | tee qualification/historical-detach.log
          bash test/run_usb_msp_historical_test.sh 2>&1 | tee qualification/historical-msp.log
      - name: Qualify checked MSP composition, detach ordering and six host tables
        run: |
          set -euo pipefail
          bash test/run_usb_msp_checked_consumer_test.sh 2>&1 | tee qualification/msp-composition.log
          python test/usb_msp_checked_mutation_test.py 2>&1 | tee qualification/msp-mutations.log
          bash test/run_program_msp_test.sh 2>&1 | tee qualification/program-msp.log
      - name: Qualify mass-storage prefix and XInput legacy-tail boundaries
        run: |
          set -euo pipefail
          flags=(-std=c11 -Wall -Wextra -Werror -I sdk/driver)
          if [[ "$SANITIZE" == 1 ]]; then
            flags+=(-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -g)
          fi
          cc "${flags[@]}" -fPIC -fvisibility=hidden -shared Drivers/usb_mass_storage/driver.c -o /tmp/mass-storage.so
          cc "${flags[@]}" test/drivers/usb_mass_storage_test.c -ldl -o /tmp/mass-storage-test
          /tmp/mass-storage-test /tmp/mass-storage.so 2>&1 | tee qualification/mass-storage.log
          git show 763fe4cae2c1359d69d18a20fe4e6860301ab50a:Drivers/usb_mass_storage/driver.c > /tmp/original-mass-storage.c
          cc "${flags[@]}" -fPIC -fvisibility=hidden -shared /tmp/original-mass-storage.c -o /tmp/original-mass-storage.so
          python - <<'PYTHON' 2>&1 | tee qualification/mass-storage-negative.log
          import resource, subprocess
          resource.setrlimit(resource.RLIMIT_CORE, (0, 0))
          result = subprocess.run(['/tmp/mass-storage-test', '/tmp/original-mass-storage.so'], capture_output=True, text=True)
          assert result.returncode != 0, 'original prefix bug escaped'
          assert 'Assertion' in result.stderr and 'driver->start(dep,1)' in result.stderr and 'failed' in result.stderr, result.stderr
          print('REJECTED original PR33 prefix gate at expected assertion:', result.stderr.strip())
          PYTHON
          cc "${flags[@]}" test/drivers/usb_xinput_gamepad_test.c -o /tmp/xinput-test
          /tmp/xinput-test 2>&1 | tee qualification/xinput.log
      - name: Qualify numeric manifests with unchanged pinned Runtime parser
        run: |
          set -euo pipefail
          bash test/run_msp_numeric_manifest_test.sh .source/runtime Drivers/usb_mass_storage/manifest.json 2>&1 | tee qualification/runtime-parser.log
      - name: Record qualification evidence hashes
        if: always()
        run: |
          set -euo pipefail
          mkdir -p qualification
          printf '%s\n' "Source-level candidate qualification only; no hardware, electrical, product admission, canonical byte replacement, merge or release." > qualification/SCOPE.txt
          git status --porcelain --untracked-files=no > qualification/source-status.txt
          test ! -s qualification/source-status.txt
          (cd qualification && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: msp-qualification-${{ github.event.pull_request.head.sha || github.sha }}-sanitize-${{ matrix.sanitize }}
          path: qualification/
          if-no-files-found: error

  historical-release-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check out immutable historical generic producer inputs
        uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Drivers
          ref: a7ae39994603c4545a3c014f09051ecfc12084d2
          path: .source/legacy-generic
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install platformio==6.1.19
      - name: Install the exact historical S3 compiler only
        run: pio pkg install --global --tool 'espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5'
      - name: Require exact historical CH34x ELF with retained source snapshot
        run: |
          export NATIVE_DRIVER_CC="$HOME/.platformio/packages/toolchain-xtensa-esp32s3/bin/xtensa-esp32s3-elf-gcc"
          python scripts/build_usb_ch34x_v2.py --require-byte-parity --output dist/usb-ch34x-v2-historical-qualification
      - uses: actions/upload-artifact@v4
        with:
          name: usb-ch34x-v2-historical-qualification
          path: dist/usb-ch34x-v2-historical-qualification
      - name: Require exact historical CP210x ELF with retained source snapshot
        run: |
          export NATIVE_DRIVER_CC="$HOME/.platformio/packages/toolchain-xtensa-esp32s3/bin/xtensa-esp32s3-elf-gcc"
          python scripts/build_usb_cp210x_v2.py --require-byte-parity --output dist/usb-cp210x-v2-historical-qualification
      - uses: actions/upload-artifact@v4
        with:
          name: usb-cp210x-v2-historical-qualification
          path: dist/usb-cp210x-v2-historical-qualification
      - name: Require exact historical clock ELF with retained source snapshot
        run: |
          export NATIVE_DRIVER_CC="$HOME/.platformio/packages/toolchain-xtensa-esp32s3/bin/xtensa-esp32s3-elf-gcc"
          python scripts/build_platform_clock_v1.py --require-byte-parity --output dist/platform-clock-v1-historical-qualification
      - name: Retain historical clock qualification
        uses: actions/upload-artifact@v4
        with:
          name: platform-clock-v1-historical-qualification
          path: dist/platform-clock-v1-historical-qualification
      - name: Reproduce BQ historical bytes with bound current builder provenance
        run: |
          export NATIVE_DRIVER_CC="$HOME/.platformio/packages/toolchain-xtensa-esp32s3/bin/xtensa-esp32s3-elf-gcc"
          python scripts/build_board_power_t5s3_v2.py --require-byte-parity --output dist/board-power-t5s3-v2-historical-qualification
      - uses: actions/upload-artifact@v4
        with:
          name: board-power-t5s3-v2-historical-qualification
          path: dist/board-power-t5s3-v2-historical-qualification
      - name: Require historical GCC8 generic release bytes
        working-directory: .source/legacy-generic
        run: |
          export NATIVE_DRIVER_CC="$HOME/.platformio/packages/toolchain-xtensa-esp32s3/bin/xtensa-esp32s3-elf-gcc"
          for driver in board_power_t5s3_v2 t5s3_usb_power_profile usb_mass_storage usb_hid_gamepad usb_ui_navigation display_epd_video; do
            python "scripts/build_${driver}.py" --require-byte-parity
          done
      - name: Check out immutable historical MSP producers
        uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Drivers
          ref: a7ae39994603c4545a3c014f09051ecfc12084d2
          path: .source/legacy-msp
          persist-credentials: false
      - name: Require unchanged historical MSP release bytes
        working-directory: .source/legacy-msp
        run: |
          export NATIVE_DRIVER_CC="$HOME/.platformio/packages/toolchain-xtensa-esp32s3/bin/xtensa-esp32s3-elf-gcc"
          python scripts/build_usb_msp.py --require-byte-parity
          python scripts/build_program_msp.py --require-byte-parity
      - run: python scripts/build_i2c_esp32s3_v2.py --require-byte-parity
        working-directory: .source/legacy-generic
      - name: Check out the verified historical USB controller producer
        uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Drivers
          ref: 179979b94cc5a1d4787c0ad99515c5c07edd92d8
          path: .source/legacy-controller
          persist-credentials: false
          sparse-checkout: |
            Drivers/usb_controller_esp32s3
            scripts
      - name: Verify immutable controller sources and wrong-source rejection
        env:
          HISTORICAL_CONTROLLER_SOURCE: .source/legacy-controller
        run: python -m unittest discover -s test/parity -p test_usb_controller_release_parity.py -v
      - name: Require historical USB controller release bytes
        working-directory: .source/legacy-controller
        run: python scripts/build_usb_controller_release_parity.py --require-byte-parity
      - name: Audit the historical USB controller loader map
        working-directory: .source/legacy-controller
        run: python scripts/verify_usb_controller_loader_map.py dist/usb-controller-esp32s3/driver.elf
      - name: Collect historical proof without changing producer inputs
        run: |
          # Reject any output collision instead of replacing tracked provenance.
          for driver in board-power-t5s3-v2 t5s3-usb-power-profile usb-mass-storage usb-hid-gamepad usb-ui-navigation display-epd-video i2c-esp32s3-v2; do
            test ! -e "dist/$driver"
            cp -a ".source/legacy-generic/dist/$driver" "dist/$driver"
          done
          for driver in usb-msp program-msp; do
            test ! -e "dist/$driver"
            cp -a ".source/legacy-msp/dist/$driver" "dist/$driver"
          done
          test ! -e dist/usb-controller-esp32s3
          cp -a .source/legacy-controller/dist/usb-controller-esp32s3 dist/usb-controller-esp32s3
      - uses: actions/upload-artifact@v4
        with:
          name: historical-release-parity
          if-no-files-found: error
          path: |
            dist/board-power-t5s3-v2/
            dist/t5s3-usb-power-profile/
            dist/usb-mass-storage/
            dist/usb-msp/
            dist/usb-hid-gamepad/
            dist/usb-ui-navigation/
            dist/program-msp/
            dist/display-epd-video/
            dist/i2c-esp32s3-v2/
            dist/usb-controller-esp32s3/
