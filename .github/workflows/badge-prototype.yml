name: Badge prototype cohort
on:
  pull_request:
    paths:
      - 'boards/waveshare-esp32-s3-touch-amoled-1.75c/prototype/**'
      - 'scripts/*badge*'
      - 'tests/*badge*'
      - 'test/*badge*'
      - 'Drivers/axp2101_*/**'
      - 'Drivers/power_key_navigation/**'
      - 'Drivers/gpio_key_sleep/**'
      - 'Drivers/cst9217_touch/**'
      - 'scripts/hybrid_evidence_gate.py'
      - 'scripts/recover_badge_ci_sources.py'
      - 'scripts/badge_source_pack.py'
      - 'docs/badge-source-recovery/**'
      - 'tests/test_badge_source_pack.py'
      - 'scripts/test_gpio_key_sleep.py'
      - 'scripts/cst9217_sdk.py'
      - 'tests/test_gpio_key_sleep.c'
      - 'scripts/springboard_evidence_gate.py'
      - 'scripts/settings_evidence_gate.py'
      - 'scripts/wifi_gap_evidence_gate.py'
      - 'scripts/picker_evidence_gate.py'
      - 'test/test_picker_evidence_gate.py'
      - 'test/test_wifi_gap_evidence_gate.py'
      - 'scripts/wifi_geometry_profile.py'
      - 'scripts/private_storage_profile.py'
      - 'scripts/timecard_evidence_gate.py'
      - 'test/test_timecard*'
      - 'tests/test_timecard*'
      - 'tests/badge_hybrid_execution.cpp'
      - 'tests/badge_hybrid_alarm_execution.inc'
      - 'tests/badge_settings*'
      - 'tests/badge_wifi*'
      - 'test/test_settings_evidence_gate.py'
      - 'test/drivers/cst9217*'
      - 'test/run_cst9217_touch_test.sh'
      - 'Drivers/qmi8658_accel/**'
      - '.github/workflows/badge-prototype.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prototype:
    name: Prototype (${{ matrix.profile }})
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - profile: historical-minimal
            flags: ''
            recovery_flags: ''
          - profile: selected-full
            flags: '--foreground-idle --include-files --native-daily --native-alarms --alarm-ready-drain --nova-mask-bounds --settings-alpha-geometry --raster-overwrite-clear --raster-underlay-exchange --native-alarm-geometry --quick-actions --native-wifi-geometry --time-server-sync --interaction-trace --native-glyph-coverage-cache --native-stroke-coverage-cache --picker-compositor-plan --native-damage-replay --native-settings-ui --round-settings-ui --sliced-native-frames --native-performance-trace --springboard-quick-actions --springboard-gesture-diagnostics --include-timecard --reuse-columns --queued-pixels --native-stripe-rows 16 --reuse-unchanged-stripes'
            recovery_flags: '--include-timecard'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container: espressif/idf:v6.1@sha256:81893c71bb5e570088901f21def8684c25cd2a9020281bd01b843a7655edb18c
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CMAKE_BUILD_PARALLEL_LEVEL: '1'
      IDF_COMPONENT_MANAGER: '0'
    defaults:
      run:
        shell: bash
    steps:
      - name: Recover exact selected source cohorts
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/badge-prototype"
          echo "BADGE_PROTOTYPE_ROOT=$root" >> "$GITHUB_ENV"
          git init --quiet "$root/drivers"
          git -C "$root/drivers" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -C "$root/drivers" fetch --no-tags --depth=1 origin "$SOURCE_SHA"
          git -C "$root/drivers" checkout --quiet --detach FETCH_HEAD
          python "$root/drivers/scripts/recover_badge_ci_sources.py" --workspace "$root" ${{ matrix.recovery_flags }}
      - name: Build, admit, execute, replay and seal matching cohort
        run: |
          set -euo pipefail
          source "$IDF_PATH/export.sh" >/dev/null
          python "$BADGE_PROTOTYPE_ROOT/drivers/test/test_badge_native_first.py"
          python "$BADGE_PROTOTYPE_ROOT/drivers/scripts/run_badge_prototype_ci.py" \
            --workspace "$BADGE_PROTOTYPE_ROOT" --idf "$IDF_PATH" \
            --cc "$(command -v xtensa-esp32s3-elf-gcc)" \
            --output "$BADGE_PROTOTYPE_ROOT/prototype-evidence" ${{ matrix.flags }} ${{ matrix.profile == 'selected-full' && '--spiffs-source' || '' }} ${{ matrix.profile == 'selected-full' && format('{0}/spiffs', env.BADGE_PROTOTYPE_ROOT) || '' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: badge-prototype-${{ matrix.profile }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ env.BADGE_PROTOTYPE_ROOT }}/source-recovery.json
            ${{ env.BADGE_PROTOTYPE_ROOT }}/prototype-evidence/local-quick-*
            ${{ env.BADGE_PROTOTYPE_ROOT }}/prototype-evidence/time-sync-owning/**
            ${{ env.BADGE_PROTOTYPE_ROOT }}/prototype-evidence/*.log
            ${{ env.BADGE_PROTOTYPE_ROOT }}/prototype-evidence/*.json
            ${{ env.BADGE_PROTOTYPE_ROOT }}/prototype-evidence/*.zip
            ${{ env.BADGE_PROTOTYPE_ROOT }}/prototype-evidence/*-rasters/
            ${{ env.BADGE_PROTOTYPE_ROOT }}/prototype-evidence/admission-*/
            ${{ env.BADGE_PROTOTYPE_ROOT }}/prototype-evidence/packaged-geometry-*/
            ${{ env.BADGE_PROTOTYPE_ROOT }}/prototype-evidence/software-evidence/
            ${{ env.BADGE_PROTOTYPE_ROOT }}/prototype-evidence/native/build-proof.json
            ${{ env.BADGE_PROTOTYPE_ROOT }}/prototype-evidence/native/build/riscrte_native.elf
            ${{ env.BADGE_PROTOTYPE_ROOT }}/prototype-evidence/native/build/qualification/
            ${{ env.BADGE_PROTOTYPE_ROOT }}/prototype-evidence/target/build.json
            ${{ env.BADGE_PROTOTYPE_ROOT }}/prototype-evidence/timecard-*/**/receipt.json
            ${{ env.BADGE_PROTOTYPE_ROOT }}/prototype-evidence/timecard-*/**/results.json
          if-no-files-found: error
          retention-days: 30
