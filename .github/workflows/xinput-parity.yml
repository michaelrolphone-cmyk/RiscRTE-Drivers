name: XInput parity completion

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install platformio==6.1.19
      - run: pio pkg install -e toolchain
      - name: Test usb-xinput-gamepad discovery, state, hotplug and shutdown
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I sdk/driver \
            test/drivers/usb_xinput_gamepad_test.c -o /tmp/usb-xinput-gamepad-test
          /tmp/usb-xinput-gamepad-test
      - run: python scripts/build_usb_xinput_gamepad.py
      - uses: actions/upload-artifact@v4
        with:
          name: usb-xinput-gamepad
          path: dist/usb-xinput-gamepad
