name: Guarded S3 IQ driver
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  driver:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: bash test/run_s3_radio_iq_test.sh
      - run: SANITIZE=1 bash test/run_s3_radio_iq_test.sh
      - run: python -m pip install platformio==6.1.19
      - run: pio pkg install --global --tool 'espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5'
      - run: python scripts/build_s3_radio_iq_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: s3-radio-iq-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/s3-radio-iq-v1/
          if-no-files-found: error
