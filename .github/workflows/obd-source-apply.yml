name: Publish BLE serial source
on:
  push:
    branches: [feat/ble-serial-client]
    paths: [.github/workflows/obd-source-apply.yml]
permissions:
  contents: read
jobs:
  apply:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply tested source
        run: |
          set -euo pipefail
          git diff --exit-code 179979b94cc5a1d4787c0ad99515c5c07edd92d8 HEAD -- Drivers scripts sdk test
          python3 - <<'PY'
          import base64,lzma,hashlib
          from pathlib import Path
          encoded=''
          patch=lzma.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='4e8cfaf9500196ca634bbae8f42422a6d4275d8385de1ca7fbb531a53a246c34'
          Path('/tmp/obd.patch').write_bytes(patch)
          PY
          git apply --check /tmp/obd.patch
          git apply --index /tmp/obd.patch
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Add reusable BLE central serial capability with bounded discovery and real-stack tests'
          git push origin HEAD:feat/ble-serial-client
