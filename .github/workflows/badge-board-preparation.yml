name: Badge board preparation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  board-preparation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Checkout exact scoped Runtime SDK
        uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: 13eca114cb58469cf6004fafc3da84fbd9d29beb
          path: .ci/runtime
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Validate exact board profile and startup custody
        run: bash test/run_board_preparation_test.sh
      - name: Preserve existing CST9217 controller qualification
        run: bash test/run_cst9217_touch_test.sh .ci/runtime
      - name: Install existing pinned native GCC15 toolchain
        run: bash scripts/install_native_driver_toolchain.sh
      - name: Build integration archive, not firmware
        run: python scripts/build_board_preparation.py
      - uses: actions/upload-artifact@v4
        with:
          name: badge-board-preparation-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/badge-board-preparation/
          if-no-files-found: error
