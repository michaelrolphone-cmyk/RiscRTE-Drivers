name: PCA9535 scoped GPIO authority
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pca9535:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: 13eca114cb58469cf6004fafc3da84fbd9d29beb
          path: .ci/runtime
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Qualify actual current I2C and Runtime graph consumers
        run: |
          ulimit -c 0
          python test/run_pca9535_composition.py --runtime .ci/runtime --output dist/pca9535-gpio/consumer-normal.json
          python test/run_pca9535_composition.py --runtime .ci/runtime --output dist/pca9535-gpio/consumer-ubsan.json --sanitize
      - name: Install existing pinned native compiler
        run: bash scripts/install_native_driver_toolchain.sh
      - name: Build current target provider with exact input provenance
        run: python scripts/build_pca9535_gpio.py --runtime .ci/runtime
      - uses: actions/upload-artifact@v4
        with:
          name: pca9535-gpio-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/pca9535-gpio/
          if-no-files-found: error
